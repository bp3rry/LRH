# LRH shot definitions. Coordinates are LRH local metres (PTM origin.json, EPSG:6344
# offsets; Z = NAVD88 elevation). Blender scene is Z-up.
#
# kind: check      review/diagnostic views (overlays allowed, no caption)
# kind: marketing  published frames (no overlays, no docks, caption required; PLAN.md §7)
#
# sun: local clock time at the site; the solar position is computed from it.
# collections: the collections rendered; every other collection is excluded.

render:
  exposure: -4.0   # AgX exposure for the physical sky; a shot may override it
  haze_visibility_km: 25   # compositor aerial perspective; a shot may override (0 = off)
  flooded_timber: dying    # habitat-zone trees below pool: leafy | dying | snags | none
  spanish_moss: true       # owner choice, 14 Oct 2026 (dying + moss)
  redline: false           # parcel/lot redlines and lot numbers (Phase 2b)
  driveways: false         # one gravel driveway per lot off CR 3635
  docks: false             # one dock per lot pair + shoreline paths (UTRWD permit required)
  cleared_ground: soil     # the parcels' cleared ground: soil (as photographed) | grassed
  draft: {resolution: [1920, 1080], samples: 96}
  final: {resolution: [7680, 4320], samples: 1024, tile_size: 2048}
  caption: "Artist's conception. Lake shown at conservation pool. Lot lines approximate, subject to survey and plat."
  caption_docks: "Docks conceptual, subject to UTRWD Shoreline Use Permit."

shots:
  check_lotplan_ortho:
    kind: check
    description: North-up ortho matching the PTM lot plan.
    camera: {type: ortho, center: [0.0, 35.0], ortho_scale_m: 600.0}
    haze_visibility_km: 0
    resolution: [1200, 1500]
    sun: {datetime: "2026-10-14T12:30", utc_offset_h: -5}
    collections: [Terrain, Water, Roads, Vegetation, Overlays_Review]

  check_drone_match:
    kind: check
    description: Camera matched to inputs/reference/drone-ladonia-arial-1.jpeg.
    # Solved by scripts/solve_drone_camera.py against PTM's survey-registered outline
    # (out/<date>/drone_camera_solve.json has the residuals).
    camera: {position: [398.80, -454.22, 430.18], target: [-91.03, -24.76, 175.00], lens_mm: 28.883, roll_deg: -3.739}
    resolution: [2016, 1134]
    sun: {datetime: "2026-08-20T11:30", utc_offset_h: -5}
    collections: [Terrain, Water, Roads, Landmarks, Vegetation, Overlays_Review]

  check_lake_oblique:
    kind: check
    description: Lake-facing oblique from above the lots.
    camera: {position: [260.0, 10.0, 260.0], target: [-420.0, 60.0, 168.0], lens_mm: 28.0}
    sun: {datetime: "2026-10-14T16:00", utc_offset_h: -5}
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  check_bridge:
    kind: check
    description: SH 34 twin bridges from the south-east, low oblique.
    camera: {position: [-1500.0, 300.0, 260.0], target: [-2300.0, 1450.0, 172.0], lens_mm: 35.0}
    sun: {datetime: "2026-10-14T15:00", utc_offset_h: -5}
    cleared_ground: grassed
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  check_dam:
    kind: check
    description: Leon Hurse Dam riprap face from over the lake, looking east.
    camera: {position: [500.0, 1900.0, 260.0], target: [1199.0, 1600.0, 170.0], lens_mm: 30.0}
    sun: {datetime: "2026-10-14T10:00", utc_offset_h: -5}
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  check_cr3640:
    kind: check
    description: Relocated CR 3640 causeway over the creek arm, looking north-west.
    camera: {position: [0.0, -520.0, 230.0], target: [-420.0, -150.0, 168.0], lens_mm: 30.0}
    sun: {datetime: "2026-10-14T15:00", utc_offset_h: -5}
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  check_timber_boat:
    kind: check
    description: Flooded timber from a boat in the creek arm, 2 m above the water, looking north (sun behind).
    # Open water 16 m from the nearest tree, ~100 lidar trees ahead (side arm, west).
    camera: {position: [-435.0, 135.0, 170.0], target: [-435.0, 235.0, 172.0], lens_mm: 28.0}
    sun: {datetime: "2026-10-14T16:30", utc_offset_h: -5}
    haze_visibility_km: 40
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  check_lotplan_features:
    kind: check
    description: North-up plan with redlines, driveways, docks and shoreline paths (Phase 2b review).
    camera: {type: ortho, center: [20.0, 120.0], ortho_scale_m: 820.0}
    haze_visibility_km: 0
    resolution: [1400, 1500]
    sun: {datetime: "2026-10-14T12:30", utc_offset_h: -5}
    cleared_ground: grassed
    redline: true
    driveways: true
    docks: true
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  # --- Phase 2 hero stills (marketing: no overlays or docks; caption added) ---
  H1_arrival:
    kind: marketing
    description: High oblique from the southeast over CR 3635, west-northwest across the lots to the lake and SH 34 bridge.
    camera: {position: [360.0, -470.0, 340.0], target: [-420.0, 260.0, 168.0], lens_mm: 24.0}
    sun: {datetime: "2026-10-14T16:30", utc_offset_h: -5}
    cleared_ground: grassed  # owner, 14 Oct 2026
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  H3_from_lake:
    kind: marketing
    description: Elevated view from over the open lake north-west of the lots, looking back south-east at the lot frontage, mid-afternoon.
    camera: {position: [-560.0, 860.0, 330.0], target: [0.0, 0.0, 176.0], lens_mm: 32.0}
    sun: {datetime: "2026-10-14T15:00", utc_offset_h: -5}
    cleared_ground: grassed  # owner, 14 Oct 2026
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  H1_arrival_lotplan:
    kind: marketing
    description: H1 with redlines, driveways and docks (Phase 2b).
    camera: {position: [360.0, -470.0, 340.0], target: [-420.0, 260.0, 168.0], lens_mm: 24.0}
    sun: {datetime: "2026-10-14T16:30", utc_offset_h: -5}
    cleared_ground: grassed
    redline: true
    driveways: true
    docks: true
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  V_west_to_dam:
    kind: marketing
    description: From over the creek arm west of the lots, looking east across the lots toward Leon Hurse Dam.
    # Enhanced (owner, 15 Oct 2026): higher and tighter, aimed between the lots and the
    # dam, clearer air so the dam reads at ~1.8 km.
    camera: {position: [-620.0, -120.0, 360.0], target: [700.0, 520.0, 168.0], lens_mm: 32.0}
    sun: {datetime: "2026-10-14T17:00", utc_offset_h: -5}
    haze_visibility_km: 40
    cleared_ground: grassed
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]

  V_west_to_dam_redline:
    kind: marketing
    description: V_west_to_dam with red parcel and lot lines and lot numbers.
    camera: {position: [-620.0, -120.0, 360.0], target: [700.0, 520.0, 168.0], lens_mm: 32.0}
    sun: {datetime: "2026-10-14T17:00", utc_offset_h: -5}
    haze_visibility_km: 40
    cleared_ground: grassed
    redline: true
    collections: [Terrain, Water, Roads, Landmarks, Vegetation]
